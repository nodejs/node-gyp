name: node-gyp integration
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-gyp-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13", "3.15"]
        include:
          - os: macos-26-intel  # macOS on Intel
            python-version: 3.x
          - os: ubuntu-24.04-arm  # Ubuntu on ARM
            python-version: 3.x
          - os: windows-11-arm  # Windows on ARM
            python-version: 3.x
          - os: windows-2025-vs2026  # Windows with Visual Studio 2026
            python-version: 3.x
    runs-on: ${{ matrix.os }}
    steps:
      - name: Clone gyp-next
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gyp-next
          persist-credentials: false
      - name: Clone nodejs/node-gyp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nodejs/node-gyp
          path: node-gyp
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install Python dependencies
        run: |
          cd gyp-next
          python -m pip install --upgrade pip
          pip install --editable .
          pip uninstall -y gyp-next
      - name: Install Node.js dependencies
        run: |
          npm install --global npm@12
          cd node-gyp
          npm install --no-progress
      - name: Replace gyp in node-gyp
        shell: bash
        run: |
          rm -rf node-gyp/gyp
          cp -r gyp-next node-gyp/gyp
      - name: Run tests (macOS or Linux)
        if: runner.os != 'Windows'
        run: |
          cd node-gyp
          npm test
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd node-gyp
          npm run test
